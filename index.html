<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Band World Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Cormorant+Garamond:wght@500;600&family=Gowun+Batang:wght@400;700&family=Shippori+Mincho:wght@500;600&family=Noto+Serif+SC:wght@500&family=Silkscreen:wght@400;700&family=Pinyon+Script&family=Gowun+Dodum&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: idol-cafe poster language — sky-blue polka-dot ground, glowing white blobs and sparkles, pixel + script title —
   then a dotted world map where each country is a pin and its songs gather beside it (west = wistful, east = bright, north = loud). */
:root{
  --sky:#cfe3ff; --sky-2:#e9f3ff; --white:#ffffff; --ink:#46638f; --ink-2:#6f87ad; --blue:#5b93e6; --pale:#a9c7f3;
  --jp:#ff6fa8; --kr:#3f7fe0; --us:#8a6cf0; --gb:#1fb39a; --ca:#f2a93b; --eu:#5ab0ff; --ea:#c77dff; --oc:#18b6c8; --la:#ff8a3d; --af:#e8604c;
  --f-round:"Rammetto One","Gowun Dodum",system-ui,sans-serif;
  --f-pixel:"Silkscreen","DotGothic16",monospace;
  --f-script:"Pinyon Script",cursive;
  --f-body:"Gowun Dodum","Zen Maru Gothic","Noto Sans SC",system-ui,sans-serif;
  --f-ja:"Zen Maru Gothic","Gowun Dodum",system-ui,sans-serif;
  --f-zh:"Noto Sans SC","Zen Maru Gothic",system-ui,sans-serif;
  --f-serif:"Cormorant Garamond","Gowun Batang",serif;
  --navy:#1f2f55;
  --f-mix:"Zen Maru Gothic","Gowun Dodum","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--sky)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background:radial-gradient(circle,rgba(255,255,255,.8) 2.3px,transparent 2.8px) 0 0/26px 26px,linear-gradient(165deg,#b9d6ff 0%,var(--sky-2) 42%,#d3e6ff 75%,#e9f3ff 100%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
:lang(ja) body{font-family:var(--f-ja)} :lang(zh) body{font-family:var(--f-zh)}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 72px;display:grid;gap:30px;position:relative}
.label{font-family:var(--f-round);font-size:13px;color:var(--blue);letter-spacing:.02em;text-transform:lowercase}

/* decor */
.decor{position:absolute;pointer-events:none;z-index:0}
.blob-star{width:min(520px,80vw);aspect-ratio:1;left:-90px;top:60px;filter:blur(18px);opacity:.95}
.blob-oval{width:min(560px,90vw);height:200px;right:-60px;top:330px;border-radius:50%;background:#fff;filter:blur(30px);opacity:.75}
.spark{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.6;filter:drop-shadow(0 0 4px rgba(120,170,240,.6))}
.spark.fill{fill:#9cc2f6;stroke:none;filter:blur(.4px)}
.wing{width:84px;right:6%;top:300px;opacity:.95}

/* hero */
.hero{position:relative;z-index:1;display:grid;gap:14px}
.topline{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center}
.pill{font-family:var(--f-round);font-size:11px;letter-spacing:.08em;color:var(--pale);background:rgba(255,255,255,.92);padding:7px 16px;border-radius:99px;box-shadow:0 0 18px rgba(255,255,255,.9)}
.lang{display:inline-flex;gap:2px;background:rgba(255,255,255,.75);border-radius:99px;padding:3px;box-shadow:0 0 14px rgba(255,255,255,.8)}
.lang button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:400 11px/1 var(--f-round);letter-spacing:.06em;padding:7px 10px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
.title-wrap{position:relative;padding-top:clamp(4px,1vw,12px)}
h1{margin:0;position:relative;line-height:.85;display:flex;align-items:flex-end;flex-wrap:wrap}
h1 .script{font-family:var(--f-script);font-weight:400;font-size:clamp(64px,10.5vw,138px);color:var(--blue);line-height:.7;margin-right:-.05em;position:relative;z-index:2;text-shadow:0 0 16px #fff,0 0 3px #fff}
h1 .pix{font-family:var(--f-pixel);font-weight:700;font-size:clamp(60px,12vw,156px);color:#fff;letter-spacing:.02em;text-shadow:0 3px 0 #a9c7f3,0 0 26px rgba(255,255,255,.95),0 0 2px #8db6ef}
.tag{margin:clamp(22px,3vw,34px) 0 0;font-family:var(--f-round);font-size:clamp(11px,1.35vw,15px);letter-spacing:.03em;color:var(--blue);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
:lang(ja) .tag{font-family:var(--f-ja);font-weight:700} :lang(zh) .tag{font-family:var(--f-zh);font-weight:500}
.hero-row{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-start;justify-content:space-between;margin-top:0}
.boxes{display:grid;gap:12px;justify-items:start}
.boxes span{display:inline-block;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.35);padding:8px 22px;font-size:15px;color:var(--ink-2);box-shadow:0 0 12px rgba(255,255,255,.6)}
.boxes span:nth-child(2){margin-left:clamp(12px,4vw,48px)}
.intro{margin:0;max-width:52ch;font-size:15px;color:var(--ink);text-wrap:pretty}
.date-bar{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;background:rgba(255,255,255,.85);padding:14px 26px;border-radius:4px;box-shadow:0 0 30px 6px rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.date-bar div{display:flex;gap:10px;align-items:baseline}
.date-bar b{font-family:var(--f-round);font-weight:400;font-size:22px;color:#8fb6ef;letter-spacing:.02em}

/* controls */
.controls{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.7);border-radius:26px;box-shadow:0 0 30px rgba(255,255,255,.9)}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group .label{margin-right:6px}
.chip{appearance:none;border:0;background:#fff;color:var(--ink);font:400 13px/1 var(--f-body);padding:8px 12px;border-radius:99px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;box-shadow:0 1px 0 rgba(120,160,220,.25);transition:opacity .15s,background .15s}
:lang(ja) .chip{font-family:var(--f-ja)} :lang(zh) .chip{font-family:var(--f-zh)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--blue))}
.chip small{color:var(--ink-2);font-size:11px}
.chip[aria-pressed="false"]{opacity:.42}
.chip.mood{font-family:var(--f-round);font-size:11px;text-transform:lowercase;letter-spacing:.02em;color:var(--blue)}
.chip.mood[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg{display:inline-flex;background:#fff;border-radius:99px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:400 13px/1 var(--f-body);padding:9px 14px;border-radius:99px;cursor:pointer}
:lang(ja) .seg button{font-family:var(--f-ja)} :lang(zh) .seg button{font-family:var(--f-zh)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.chip:focus-visible,.pin:focus-visible,.seg button:focus-visible,.lang button:focus-visible,.idx a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.search{appearance:none;background:#fff;border:0;color:var(--ink);font:400 14px var(--f-body);padding:9px 14px;border-radius:99px;width:210px;max-width:100%}
.search::placeholder{color:var(--ink-2)}

/* map */
.map-panel{position:relative;z-index:1;display:grid;gap:10px}
.map-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:30px;background:rgba(255,255,255,.42);box-shadow:0 0 40px rgba(255,255,255,.85),inset 0 0 0 2px rgba(255,255,255,.9)}
.map{position:relative;width:100%;min-width:960px;aspect-ratio:1000/520}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctry-label{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-round);line-height:1;font-size:var(--fs,14px);color:var(--c);pointer-events:none;text-align:center;white-space:nowrap;text-transform:lowercase;text-shadow:0 0 8px #fff,0 0 3px #fff,0 0 1px #fff;transition:opacity .4s}
:lang(ja) .ctry-label{font-family:var(--f-ja);font-weight:700} :lang(zh) .ctry-label{font-family:var(--f-zh);font-weight:500}
.ctry-label small{display:block;font-family:var(--f-pixel);font-size:10px;color:var(--ink-2);margin-top:2px;text-transform:none}
.map.grid .ctry-label{opacity:0}
.bubble{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;padding:0;cursor:pointer;z-index:3;display:grid;place-items:center;align-content:center;gap:4px;color:var(--navy);
  background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .35s,transform .35s,background .2s}
.bubble i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.bubble b{font-family:var(--f-serif);font-weight:500;font-size:var(--fs);line-height:1;white-space:nowrap;letter-spacing:.01em}
.bubble small{font-family:var(--f-serif);font-weight:500;font-size:13px;line-height:1;opacity:.7;font-variant-numeric:lining-nums}
.bubble.mini i{width:4px;height:4px}
.bubble.mini b{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-size:13px}
.bubble.mini small{font-size:11px}
:lang(ja) .bubble b{font-family:"Cormorant Garamond","Shippori Mincho",serif} :lang(zh) .bubble b{font-family:"Cormorant Garamond","Noto Serif SC",serif}
.bubble:hover{background:rgba(255,255,255,.55)}
.bubble:focus-visible{outline:1px solid var(--navy);outline-offset:4px}
.bubble.dim{opacity:.3}
.bubble.hit{background:rgba(255,255,255,.62);border-color:#fff}
.map.grid .bubble{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.6)}
.map:not(.grid) .pin{opacity:0;pointer-events:none}
.sheet{position:fixed;left:50%;bottom:0;z-index:30;width:min(560px,100%);max-height:min(70vh,640px);display:flex;flex-direction:column;background:rgba(255,255,255,.97);border-radius:28px 28px 0 0;box-shadow:0 -8px 40px rgba(90,130,200,.25);transform:translate(-50%,105%);transition:transform .3s;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translate(-50%,0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px max(22px,env(safe-area-inset-right,0px)) 10px max(22px,env(safe-area-inset-left,0px))}
.sheet-head h3{margin:0;font-family:var(--f-round);font-weight:400;font-size:22px;color:var(--c);text-transform:lowercase}
:lang(ja) .sheet-head h3{font-family:var(--f-ja);font-weight:700} :lang(zh) .sheet-head h3{font-family:var(--f-zh);font-weight:500}
.sheet-head small{font-family:var(--f-pixel);color:var(--ink-2);margin-left:10px;font-size:13px}
.sheet-head button{appearance:none;border:0;background:var(--sky-2);color:var(--blue);border-radius:99px;width:36px;height:36px;cursor:pointer;font-size:14px;flex:none}
.sheet ol{list-style:none;margin:0;padding:0 max(22px,env(safe-area-inset-right,0px)) 18px max(22px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet li a{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:baseline;padding:9px 0;border-top:1px dashed #cfe0f7;text-decoration:none}
.sheet li a:hover .tt{color:var(--blue)}
.sheet .no{font-family:var(--f-pixel);font-size:11px;color:var(--pale)}
.sheet .tt{font-family:var(--f-mix);font-weight:500;color:#3d5f96;min-width:0;overflow-wrap:anywhere;font-size:14px}
.sheet .ar{display:block;color:var(--ink-2);font-size:12px;font-weight:400}
.sheet .go{font-family:var(--f-round);font-size:10px;color:var(--blue)}
.axis{position:absolute;font-family:var(--f-round);font-size:11px;color:var(--blue);opacity:0;transition:opacity .4s;pointer-events:none;text-transform:lowercase;text-shadow:0 0 6px #fff}
.map.grid .axis{opacity:.9}
.quad{position:absolute;font-family:var(--f-pixel);font-weight:700;font-size:clamp(28px,4vw,52px);color:#fff;opacity:0;transition:opacity .4s;pointer-events:none;line-height:.9;text-shadow:0 2px 0 #b9d3f6}
.map.grid .quad{opacity:.9}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;display:grid;place-items:center;text-decoration:none;z-index:2;transition:opacity .25s,transform .15s}
.pin::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff,0 0 8px rgba(255,255,255,.9)}
.pin:hover,.pin.sel{transform:scale(1.6);z-index:4}
.pin.dim{opacity:.12}
.pin.hit::after{content:"";position:absolute;inset:-4px;border:2px solid var(--blue);border-radius:50%}
.tip{position:absolute;z-index:6;pointer-events:none;background:#fff;color:var(--ink);padding:10px 14px 11px;border-radius:16px;min-width:160px;max-width:250px;opacity:0;transition:opacity .12s;box-shadow:0 0 24px rgba(255,255,255,.95),0 6px 20px rgba(90,130,200,.18)}
.tip.on{opacity:1}
.tip .t{font-family:var(--f-mix);font-weight:700;font-size:16px;line-height:1.25;color:#3d5f96}
.tip .a{font-size:12px;margin-top:2px}
.tip .m{font-family:var(--f-round);font-size:10px;color:var(--pale);margin-top:6px;text-transform:lowercase}
.tip .go{font-size:11px;color:var(--blue);margin-top:2px}
.map-note{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:13px;color:var(--ink-2);padding-inline:8px}

/* card */
.card{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -6px 30px rgba(90,130,200,.2);
  padding:16px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;gap:14px;align-items:center;justify-content:space-between;transform:translateY(110%);transition:transform .25s}
.card.on{transform:none}
.card .info{min-width:0}
.card .t{font-family:var(--f-mix);font-weight:700;font-size:19px;line-height:1.25;color:#3d5f96;overflow-wrap:anywhere}
.card .a{font-size:13px}
.card .m{font-family:var(--f-round);font-size:10px;color:var(--pale);margin-top:4px;text-transform:lowercase}
.card .btns{display:flex;gap:8px;flex:none}
.card a,.card button{appearance:none;border:0;border-radius:99px;font:400 12px/1 var(--f-round);padding:12px 15px;cursor:pointer;text-decoration:none}
.card a{background:var(--blue);color:#fff}
.card button{background:var(--sky-2);color:var(--blue)}

/* index */
.idx-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.idx-head h2{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:clamp(34px,5vw,58px);line-height:1;color:#fff;text-shadow:0 3px 0 #a9c7f3,0 0 20px rgba(255,255,255,.95)}
.idx-head p{margin:0;color:var(--ink-2);font-size:14px;max-width:44ch}
.idx{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;align-items:start}
.idx section{min-width:0;background:rgba(255,255,255,.78);border-radius:26px;padding:18px 18px 10px;box-shadow:0 0 28px rgba(255,255,255,.9)}
.idx h3{margin:0 0 8px;font-family:var(--f-round);font-weight:400;font-size:17px;color:var(--c);line-height:1.2;display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-transform:lowercase}
:lang(ja) .idx h3{font-family:var(--f-ja);font-weight:700} :lang(zh) .idx h3{font-family:var(--f-zh);font-weight:500}
.idx h3 small{font-family:var(--f-pixel);font-size:12px;color:var(--ink-2)}
.idx ol{list-style:none;margin:0;padding:0;display:grid}
.idx a{display:grid;grid-template-columns:2.6em 1fr;gap:6px;padding:7px 0;border-top:1px dashed #cfe0f7;text-decoration:none;font-size:13px;align-items:baseline}
.idx a:hover .tt{color:var(--blue)}
.idx .no{font-family:var(--f-pixel);font-size:11px;color:var(--pale);font-variant-numeric:tabular-nums}
.idx .tt{font-family:var(--f-mix);font-weight:500;min-width:0;overflow-wrap:anywhere;color:#3d5f96}
.idx .ar{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.idx li.dim{opacity:.3}
footer{position:relative;z-index:1;font-family:var(--f-round);font-size:11px;color:var(--blue);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center;padding:14px 4px 0;text-transform:lowercase}
footer a{font-family:var(--f-body);text-transform:none;font-size:13px;background:#fff;padding:8px 16px;border-radius:99px;text-decoration:none;box-shadow:0 0 14px rgba(255,255,255,.9)}
:lang(ja) footer a{font-family:var(--f-ja)} :lang(zh) footer a{font-family:var(--f-zh)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){.date-bar{padding:12px 18px;gap:8px 18px}.date-bar b{font-size:18px}.search{width:100%}.wing{display:none}}

/* tabs + same year */
.view{display:contents}
.tabs{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px}
.tabs a{font-family:var(--f-round);font-size:13px;text-transform:lowercase;text-decoration:none;color:var(--ink-2);background:rgba(255,255,255,.7);padding:10px 18px;border-radius:99px;box-shadow:0 0 18px rgba(255,255,255,.8)}
.tabs a[aria-current="page"]{background:var(--blue);color:#fff;box-shadow:0 0 18px rgba(91,147,230,.45)}
.tabs a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.yr-head h2 em{font-family:var(--f-script);font-style:normal;font-weight:400;color:var(--blue);text-shadow:0 0 14px #fff;font-size:1.05em;margin-left:.1em}
.yr-scroll{padding:6px 0}
.yr-svg{display:block;width:100%;min-width:860px;height:auto;cursor:crosshair}
.yr-grid{stroke:#fff;stroke-width:1;stroke-dasharray:2 5;opacity:.9}
.yr-tick{font-family:var(--f-pixel);font-size:11px;fill:var(--ink-2);text-anchor:middle}
.yr-band{opacity:.5;stroke:#fff;stroke-width:1.5}
.yr-dot{fill:#fff;stroke-width:1.6;opacity:.75;transition:r .15s,opacity .15s}
.yr-dot.on{opacity:1;r:5}
.yr-cursor{stroke:var(--navy);stroke-width:1.5;stroke-dasharray:3 4}
.yr-cursor-t{font-family:var(--f-pixel);font-size:13px;font-weight:700;fill:var(--navy);text-anchor:middle}
.yr-legend{display:inline-flex;flex-wrap:wrap;gap:6px 14px}
.yr-legend span{display:inline-flex;align-items:center;gap:6px}
.yr-legend i{width:10px;height:10px;border-radius:50%}
.yr-picker{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;background:rgba(255,255,255,.7);border-radius:26px;box-shadow:0 0 30px rgba(255,255,255,.9)}
.yr-picker input[type=range]{flex:1 1 220px;accent-color:var(--blue)}
.yr-step{appearance:none;border:0;background:#fff;color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 0 10px rgba(255,255,255,.9)}
.yr-chips{display:flex;flex-wrap:wrap;gap:6px}
.yr-chips .yr-chip{appearance:none;border:0;background:#fff;color:var(--ink);font:400 13px/1 var(--f-mix);padding:9px 14px;border-radius:99px;cursor:pointer}
.yr-chips .yr-chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.yr-card{position:relative;z-index:1;background:rgba(255,255,255,.82);border-radius:30px;padding:22px 22px 18px;box-shadow:0 0 40px rgba(255,255,255,.95);display:grid;gap:18px}
.yr-big{font-family:var(--f-pixel);font-weight:700;font-size:clamp(56px,9vw,104px);line-height:.9;color:#fff;text-shadow:0 4px 0 #a9c7f3,0 0 22px rgba(91,147,230,.35)}
.yr-feat{max-width:72ch}
.yr-feat p{margin:6px 0 0;font-family:var(--f-mix);font-size:15px;line-height:1.8;color:var(--navy);text-wrap:pretty}
.yr-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

.yr-cols .ar{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.yr-dot.x{fill:var(--sky-2);stroke-dasharray:2 1.6;opacity:.7}

.yr-legend .dk i.d2{background:var(--sky-2);border-style:dashed}

.yr-cols li.xp .tt{color:var(--ink-2)}

function relax(key,min,sameOnly){for(let it=0;it<80;it++){let moved=false;for(let i=0;i<songs.length;i++)for(let j=i+1;j<songs.length;j++){
  if(sameOnly&&songs[i].g!==songs[j].g)continue;const p=songs[i][key],q=songs[j][key];let dx=q[0]-p[0],dy=q[1]-p[1];const d=Math.hypot(dx,dy)||.01;if(d<min){const m=(min-d)/2;dx/=d;dy/=d;
  p[0]=clampX(p[0]-dx*m);p[1]=clampY(p[1]-dy*m);q[0]=clampX(q[0]+dx*m);q[1]=clampY(q[1]+dy*m);moved=true}}if(!moved)break}}

  s+='<line id="yr-cursor" class="yr-cursor" y1="10" y2="'+(RH-22)+'"/><text id="yr-cursor-t" class="yr-cursor-t" y="12"></text>';
  svg.setAttribute("viewBox","0 0 "+RW+" "+RH);svg.innerHTML=s;
  svg.onclick=e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*RW;setYear(Math.round(Y0+(x-40)/(RW-80)*(Y1-Y0)))};
  const lg=document.getElementById("yr-legend");lg.innerHTML=YG.map(g=>'<span><i style="background:var('+YGC[g]+')"></i>'+esc(g==="OT"?L().other:L().ctry[g])+'</span>').join("")+'<span class="dk"><i class="d1"></i>'+esc(L().dotP)+'</span><span class="dk"><i class="d2"></i>'+esc(L().dotX)+'</span>';
  const tg=document.getElementById("yr-x");tg.checked=showX;document.getElementById("yr-x-l").textContent=L().xToggle}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function setYear(y){ySel=Math.max(Y0,Math.min(Y1,y));const r=document.getElementById("yr-range");r.value=ySel;renderYear()}
function renderYear(){const D=L(),x=RX(ySel);const c=document.getElementById("yr-cursor"),ct=document.getElementById("yr-cursor-t");
  if(c){c.setAttribute("x1",x);c.setAttribute("x2",x);ct.setAttribute("x",x);ct.textContent=ySel}

  document.querySelectorAll(".yr-chips button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.y===ySel));
  document.getElementById("yr-big").textContent=ySel;
  const f=FEAT[ySel];const fe=document.getElementById("yr-feat");fe.hidden=!f;if(f){fe.querySelector("p").textContent=f[lang]||f.en;fe.querySelector(".label").textContent=D.feat}
  const near=YS().filter(s=>Math.abs(s.y-ySel)<=1);const cols=document.getElementById("yr-cols");
  if(!near.length){cols.innerHTML='<p class="yr-empty">'+esc(D.empty)+'</p>';return}
  const by={};near.forEach(s=>{(by[s.g]=by[s.g]||[]).push(s)});
  const order=Object.keys(by).sort((a,b)=>(YG.indexOf(grp(a))-YG.indexOf(grp(b)))||by[b].length-by[a].length);
  cols.innerHTML=order.map(k=>{const list=by[k].sort((a,b)=>Math.abs(a.y-ySel)-Math.abs(b.y-ySel)||a.y-b.y);
    return '<section style="--c:var('+(COLOR[k]||"--blue")+')"><h3>'+esc(D.ctry[k]||k)+'<small>'+list.length+'</small></h3><ol>'+list.map(s=>
      '<li class="'+(s.y===ySel?"ex":"")+(s.x?" xp":"")+'"><a href="'+esc(s.url)+'" target="_blank" rel="noopener"><span class="yy">'+s.y+'</span><span class="tt">'+esc(s.t)+(s.x?'<b class="xt">'+esc(D.xTag)+'</b>':'')+'<span class="ar">'+esc(s.a)+'</span></span></a></li>').join("")+'</ol></section>'}).join("")}
function initYear(){document.getElementById("yr-x").addEventListener("change",e=>{showX=e.target.checked;buildRiver();renderYear()});const chips=document.getElementById("yr-chips");chips.innerHTML=Object.entries(FEAT).map(([y,f])=>'<button type="button" class="yr-chip" data-y="'+y+'">'+esc(f.chip)+'</button>').join("");
  chips.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>setYear(+b.dataset.y)));
  const r=document.getElementById("yr-range");r.min=Y0;r.max=Y1;r.value=ySel;r.addEventListener("input",()=>{ySel=+r.value;renderYear()});
  document.getElementById("yr-prev").addEventListener("click",()=>setYear(ySel-1));document.getElementById("yr-next").addEventListener("click",()=>setYear(ySel+1))}
initYear();
function route(){const v=location.hash==="#year"?"year":"world";document.getElementById("v-world").hidden=v!=="world";document.getElementById("v-year").hidden=v!=="year";
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(v==="year"){buildRiver();renderYear();const sc2=document.getElementById("yr-scroll");if(sc2.scrollWidth>sc2.clientWidth)sc2.scrollLeft=(sc2.scrollWidth-sc2.clientWidth)*.7}
  else{requestAnimationFrame(()=>{window.dispatchEvent(new Event("resize"))})}}

const RP_SITE="my band";
/* =================== RANDOM SPOTIFY PLAYLIST =================== */
/* Spotify Web API, Authorization Code + PKCE (no secret in the page). Set SP_CLIENT_ID to the Client ID of the
   Spotify app whose Redirect URIs include this page's URL (origin + path, no hash). */
const SP_CLIENT_ID="__CLIENT_ID__";
const SP_REDIRECT=location.origin+location.pathname.replace(/index\.html$/,"");
const SP_SCOPES="playlist-modify-private playlist-modify-public";
const RP_N=30;
const RPUI={
 ko:{btn:"랜덤 플레이리스트 생성",title:"랜덤 플레이리스트",go:"Spotify로 이동해서 로그인하면, 이 탭의 곡 중 무작위 30곡으로 내 Spotify에 새 플레이리스트를 만들어요.",start:"Spotify로 이동",cancel:"닫기",
  find:"곡을 Spotify에서 찾는 중…",make:"플레이리스트를 만드는 중…",done:"완성됐어요. Spotify에서 열게요.",open:"Spotify에서 열기",

  find:"Spotifyで曲を探しています…",make:"プレイリストを作成しています…",done:"完成しました。Spotifyで開きます。",open:"Spotifyで開く",

 en:{btn:"Make a random playlist",title:"Random playlist",go:"Sign in to Spotify and we'll pick 30 random songs from this tab and save them as a new playlist in your Spotify.",start:"Continue to Spotify",cancel:"Close",

 zh:{btn:"生成随机歌单",title:"随机歌单",go:"登录Spotify后，将从本页歌曲中随机挑选30首，在你的Spotify里新建一个歌单。",start:"前往Spotify",cancel:"关闭",
  find:"正在Spotify中查找歌曲…",make:"正在创建歌单…",done:"完成了，正在Spotify中打开。",open:"在Spotify中打开",
  noid:"尚未连接Spotify应用。网站管理员设置Client ID后即可使用。",fail:"无法创建歌单",denied:"已取消Spotify登录。",notallowed:"该Spotify账号尚未登记为应用用户，请联系管理员添加。",found:"首歌曲已找到"}
};
Object.keys(RPUI).forEach(k=>Object.assign(I18N[k],{rp:RPUI[k]}));
const RPT=()=>L().rp;
function rpEsc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rpModal(html,actions){let m=document.getElementById("rp-modal");if(!m){m=document.createElement("div");m.id="rp-modal";m.className="rp-modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");document.body.append(m)}
  m.innerHTML='<div class="rp-box">'+html+'<div class="rp-act"></div></div>';const act=m.querySelector(".rp-act");
  (actions||[]).forEach(([label,fn,primary])=>{const b=document.createElement(fn&&fn.href?"a":"button");b.className="rp-b"+(primary?" pri":"");b.textContent=label;if(fn&&fn.href){b.href=fn.href;b.target="_blank";b.rel="noopener"}else{b.type="button";b.onclick=fn||rpClose}act.append(b)});
  m.hidden=false;const f=act.querySelector(".pri")||act.querySelector("button");f&&f.focus()}
function rpClose(){const m=document.getElementById("rp-modal");if(m)m.hidden=true}
document.addEventListener("keydown",e=>{if(e.key==="Escape")rpClose()});
function rpShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function rpRand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a).slice(0,n)}
function rpStore(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rpLoad(k){try{return JSON.parse(sessionStorage.getItem(k)||"null")}catch(e){return null}}
/* entry point: label = tab name for the playlist title, pool = [{t,a,id?}] */
function rpOpen(label,pool){const T=RPT();
  if(!SP_CLIENT_ID||SP_CLIENT_ID.startsWith("__")){rpModal('<h3>'+rpEsc(T.title)+'</h3><p>'+rpEsc(T.noid)+'</p>',[[T.cancel,null,true]]);return}
  const uniq=[];const seen=new Set();pool.forEach(s=>{const k=(s.id||(s.t+"|"+s.a)).toLowerCase();if(!seen.has(k)){seen.add(k);uniq.push(s)}});
  rpModal('<h3>'+rpEsc(T.title)+' · '+rpEsc(label)+'</h3><p>'+rpEsc(T.go)+'</p><p class="rp-sub">'+uniq.length+' songs</p>',[[T.cancel,null],[T.start,()=>rpAuth(label,uniq),true]])}
async function rpAuth(label,pool){const tok=rpLoad("rp-token");const job={label,pool:rpShuffle(pool).slice(0,Math.min(pool.length,RP_N*2)).map(s=>({t:s.t,a:s.a,id:s.id||null})),lang,hash:location.hash};
  rpStore("rp-job",job);
  if(tok&&tok.exp>Date.now()+60000){rpRun(tok.access);return}
  const verifier=rpRand(64),state=rpRand(16);rpStore("rp-pkce",{verifier,state});
  const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  const q=new URLSearchParams({client_id:SP_CLIENT_ID,response_type:"code",redirect_uri:SP_REDIRECT,scope:SP_SCOPES,code_challenge_method:"S256",code_challenge:ch,state});
  location.href="https://accounts.spotify.com/authorize?"+q}
async function rpReturn(){const p=new URLSearchParams(location.search);if(!p.has("code")&&!p.has("error"))return;
  const pk=rpLoad("rp-pkce"),job=rpLoad("rp-job");history.replaceState(null,"",SP_REDIRECT+(job&&job.hash||""));
  if(job&&job.lang&&I18N[job.lang]&&job.lang!==lang)applyLang(job.lang);
  const T=RPT();if(job&&job.hash&&typeof route==="function")route();
  if(p.has("error")||!pk||p.get("state")!==pk.state){rpModal('<h3>'+rpEsc(T.title)+'</h3><p>'+rpEsc(T.denied)+'</p>',[[T.cancel,null,true]]);return}
  rpModal('<h3>'+rpEsc(T.title)+'</h3><p class="rp-st">'+rpEsc(T.find)+'</p>');
  try{const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({client_id:SP_CLIENT_ID,grant_type:"authorization_code",code:p.get("code"),redirect_uri:SP_REDIRECT,code_verifier:pk.verifier})});
    const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||r.status);
    rpStore("rp-token",{access:j.access_token,exp:Date.now()+j.expires_in*1000});rpStore("rp-pkce",null);rpRun(j.access_token)}
  catch(e){rpModal('<h3>'+rpEsc(T.fail)+'</h3><p class="rp-sub">'+rpEsc(e.message)+'</p>',[[T.cancel,null,true]])}}
async function rpApi(tok,path,opt){const r=await fetch("https://api.spotify.com/v1"+path,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+tok,"Content-Type":"application/json"},(opt||{}).headers)}));
  if(r.status===429){await new Promise(x=>setTimeout(x,(+r.headers.get("Retry-After")||2)*1000));return rpApi(tok,path,opt)}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const err=new Error((j&&j.error&&j.error.message)||r.status);err.status=r.status;throw err}return j}
const rpClean=t=>String(t).replace(/\s*[\(\[]\s*(feat|ft|with|prod|from)[^\)\]]*[\)\]]/gi,"").replace(/\s+-\s+.*$/,"").trim();
async function rpFind(tok,s){if(s.id)return "spotify:track:"+s.id;const a=String(s.a).split(",")[0].trim(),t=rpClean(s.t);
  for(const q of ['track:"'+t+'" artist:"'+a+'"',t+" "+a]){const j=await rpApi(tok,"/search?type=track&limit=1&q="+encodeURIComponent(q));const it=j&&j.tracks&&j.tracks.items&&j.tracks.items[0];if(it)return it.uri}return null}
async function rpRun(tok){const job=rpLoad("rp-job"),T=RPT();if(!job)return;const st=()=>document.querySelector("#rp-modal .rp-st");
  rpModal('<h3>'+rpEsc(T.title)+' · '+rpEsc(job.label)+'</h3><p class="rp-st">'+rpEsc(T.find)+'</p><div class="rp-bar"><i></i></div>');
  const bar=()=>document.querySelector("#rp-modal .rp-bar i");
  try{const uris=[];for(const s of job.pool){if(uris.length>=RP_N)break;let u=null;try{u=await rpFind(tok,s)}catch(e){if(e.status===401||e.status===403)throw e}
      if(u&&!uris.includes(u))uris.push(u);if(bar())bar().style.width=(uris.length/RP_N*100)+"%";if(st())st().textContent=T.find+"  "+uris.length+"/"+RP_N}
    if(st())st().textContent=T.make;
    const d=new Date().toISOString().slice(0,10);
    const pl=await rpApi(tok,"/me/playlists",{method:"POST",body:JSON.stringify({name:RP_SITE+" · "+job.label+" · Random "+uris.length+" ("+d+")",public:false,description:"Random "+uris.length+" from "+SP_REDIRECT})});
    await rpApi(tok,"/playlists/"+pl.id+"/items",{method:"POST",body:JSON.stringify({uris})});
    rpStore("rp-job",null);const url=pl.external_urls&&pl.external_urls.spotify||"https://open.spotify.com/playlist/"+pl.id;
    rpModal('<h3>'+rpEsc(T.done)+'</h3><p class="rp-sub">'+rpEsc(pl.name)+'</p>',[[T.cancel,null],[T.open,{href:url},true]]);
    setTimeout(()=>{location.href=url},1200)}
  catch(e){if(e.status===401)rpStore("rp-token",null);rpModal('<h3>'+rpEsc(T.fail)+'</h3><p>'+rpEsc(e.status===403?T.notallowed:"")+'</p><p class="rp-sub">'+rpEsc(e.message)+'</p>',[[T.cancel,null,true]])}}
